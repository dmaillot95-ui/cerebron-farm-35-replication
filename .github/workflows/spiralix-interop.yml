name: SPIRALIX Interop F35
on:
  push:
    paths:
      - 'tools/spiralix_adapter.py'
      - '.github/workflows/spiralix-interop.yml'
  workflow_dispatch:
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/spiralix_adapter.py --farm F35 --domain replication
